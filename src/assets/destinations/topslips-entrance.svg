<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="30%" stop-color="#A0522D"/>
      <stop offset="70%" stop-color="#CD853F"/>
      <stop offset="100%" stop-color="#D2B48C"/>
    </linearGradient>
    <linearGradient id="forestBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#228B22"/>
      <stop offset="50%" stop-color="#32CD32"/>
      <stop offset="100%" stop-color="#9ACD32"/>
    </linearGradient>
  </defs>
  
  <!-- Forest Background -->
  <rect width="800" height="600" fill="url(#forestBg)"/>
  
  <!-- Trees in background -->
  <circle cx="150" cy="200" r="80" fill="#006400" opacity="0.7"/>
  <circle cx="250" cy="180" r="70" fill="#228B22" opacity="0.8"/>
  <circle cx="350" cy="160" r="90" fill="#006400" opacity="0.6"/>
  <circle cx="550" cy="170" fill="#228B22" opacity="0.7"/>
  <circle cx="650" cy="190" r="85" fill="#006400" opacity="0.8"/>
  
  <!-- Tree trunks -->
  <rect x="140" y="260" width="20" height="80" fill="#8B4513"/>
  <rect x="240" y="240" width="20" height="100" fill="#654321"/>
  <rect x="340" y="220" width="25" height="120" fill="#8B4513"/>
  <rect x="540" y="230" width="20" height="110" fill="#654321"/>
  <rect x="640" y="250" width="20" height="90" fill="#8B4513"/>
  
  <!-- Ground -->
  <rect x="0" y="350" width="800" height="250" fill="#8FBC8F"/>
  
  <!-- Wooden entrance arch structure -->
  <!-- Left post -->
  <rect x="200" y="250" width="40" height="200" fill="url(#woodGrad)"/>
  <!-- Right post -->
  <rect x="560" y="250" width="40" height="200" fill="url(#woodGrad)"/>
  
  <!-- Top horizontal beam -->
  <rect x="200" y="250" width="400" height="30" fill="url(#woodGrad)"/>
  
  <!-- Decorative carved border on top beam -->
  <path d="M200,250 Q220,240 240,250 Q260,240 280,250 Q300,240 320,250 Q340,240 360,250 Q380,240 400,250 Q420,240 440,250 Q460,240 480,250 Q500,240 520,250 Q540,240 560,250 Q580,240 600,250" 
        stroke="#654321" stroke-width="3" fill="none"/>
  
  <!-- Sign board -->
  <rect x="220" y="290" width="360" height="80" fill="#DEB887" stroke="#8B4513" stroke-width="3"/>
  
  <!-- Text on sign (stylized) -->
  <text x="400" y="320" font-family="serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#8B4513">PARAMBIKULAM</text>
  <text x="400" y="350" font-family="serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#654321">TIGER RESERVE</text>
  
  <!-- Decorative elements on posts -->
  <circle cx="220" cy="300" r="8" fill="#654321"/>
  <circle cx="220" cy="320" r="8" fill="#654321"/>
  <circle cx="220" cy="340" r="8" fill="#654321"/>
  
  <circle cx="580" cy="300" r="8" fill="#654321"/>
  <circle cx="580" cy="320" r="8" fill="#654321"/>
  <circle cx="580" cy="340" r="8" fill="#654321"/>
  
  <!-- Path/Road -->
  <rect x="300" y="400" width="200" height="150" fill="#D2B48C" opacity="0.8"/>
  
  <!-- Small plants/bushes -->
  <ellipse cx="150" cy="420" rx="30" ry="15" fill="#228B22"/>
  <ellipse cx="650" cy="430" rx="35" ry="18" fill="#32CD32"/>
  <ellipse cx="100" cy="480" rx="25" ry="12" fill="#228B22"/>
  <ellipse cx="700" cy="470" rx="28" ry="14" fill="#32CD32"/>
  
  <!-- Additional forest details -->
  <path d="M0,350 Q100,340 200,350 Q300,360 400,350 Q500,340 600,350 Q700,360 800,350" 
        stroke="#228B22" stroke-width="4" fill="none" opacity="0.6"/>
</svg>