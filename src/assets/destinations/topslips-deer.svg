<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="deerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D2B48C"/>
      <stop offset="50%" stop-color="#F4A460"/>
      <stop offset="100%" stop-color="#CD853F"/>
    </linearGradient>
    <linearGradient id="forestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="70%" stop-color="#98FB98"/>
      <stop offset="100%" stop-color="#228B22"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#forestGrad)"/>
  
  <!-- Mountains -->
  <polygon points="0,300 150,100 300,200 500,50 700,150 800,100 800,600 0,600" fill="#2F4F4F" opacity="0.7"/>
  
  <!-- Trees -->
  <circle cx="100" cy="400" r="40" fill="#228B22"/>
  <rect x="95" y="430" width="10" height="50" fill="#8B4513"/>
  
  <circle cx="200" cy="380" r="35" fill="#228B22"/>
  <rect x="195" y="405" width="10" height="45" fill="#8B4513"/>
  
  <circle cx="650" cy="390" r="45" fill="#228B22"/>
  <rect x="645" y="425" width="10" height="55" fill="#8B4513"/>
  
  <!-- Waterfall/Cascade -->
  <path d="M300,150 Q310,200 300,250 Q290,300 300,350 Q310,400 300,450" stroke="#ADD8E6" stroke-width="8" fill="none" opacity="0.8"/>
  <path d="M305,150 Q315,200 305,250 Q295,300 305,350 Q315,400 305,450" stroke="#E0F6FF" stroke-width="4" fill="none"/>
  
  <!-- Ground -->
  <rect x="0" y="450" width="800" height="150" fill="#9ACD32"/>
  
  <!-- Deer -->
  <g id="deer" transform="translate(400,350)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="50" ry="25" fill="url(#deerGrad)"/>
    
    <!-- Head -->
    <ellipse cx="-40" cy="-20" rx="20" ry="15" fill="url(#deerGrad)"/>
    
    <!-- Neck -->
    <ellipse cx="-25" cy="-10" rx="12" ry="8" fill="url(#deerGrad)"/>
    
    <!-- Legs -->
    <rect x="-35" y="20" width="6" height="35" fill="#CD853F"/>
    <rect x="-20" y="20" width="6" height="35" fill="#CD853F"/>
    <rect x="15" y="20" width="6" height="35" fill="#CD853F"/>
    <rect x="30" y="20" width="6" height="35" fill="#CD853F"/>
    
    <!-- Antlers -->
    <path d="M-45,-30 L-50,-45 M-45,-30 L-40,-45 M-45,-30 L-48,-38" stroke="#8B4513" stroke-width="3" fill="none"/>
    <path d="M-35,-30 L-30,-45 M-35,-30 L-40,-45 M-35,-30 L-32,-38" stroke="#8B4513" stroke-width="3" fill="none"/>
    
    <!-- Eye -->
    <circle cx="-45" cy="-25" r="2" fill="#000"/>
    
    <!-- Tail -->
    <ellipse cx="45" cy="-5" rx="8" ry="4" fill="#CD853F"/>
    
    <!-- Spots -->
    <circle cx="-10" cy="-5" r="3" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="10" cy="5" r="3" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="20" cy="-8" r="3" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="550" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#2F4F4F">Top Slips Deer</text>
</svg>